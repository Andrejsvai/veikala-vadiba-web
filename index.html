<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Veikala Vadība — veikalu un noliktavu vadība Latvijā."
    />
    <title>Veikala Vadība</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="lang" role="group" aria-label="Valoda">
        <button type="button" data-lang="lv" aria-pressed="true">LV</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <p class="eyebrow">Latvia · retail ops</p>
        <h1>Veikala Vadība</h1>
        <p class="tagline" data-i18n="tagline"></p>
        <p class="support" data-i18n="heroSupport"></p>
        <button type="button" class="cta" disabled data-i18n="cta"></button>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <h2 data-i18n="featuresTitle"></h2>
        <p class="section-support" data-i18n="featuresSupport"></p>
        <div class="features" id="features"></div>
      </div>
    </section>

    <section class="section audience">
      <div class="wrap">
        <h2 data-i18n="audienceTitle"></h2>
        <p class="section-support" data-i18n="audienceBody"></p>
      </div>
    </section>

    <footer class="footer">
      <div class="wrap footer-row">
        <div>
          <p class="footer-brand">Veikala Vadība</p>
          <p class="footer-note" data-i18n="footerNote"></p>
        </div>
        <p class="footer-cta" data-i18n="footerCta"></p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
